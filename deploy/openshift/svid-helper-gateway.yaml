# Gateway SVID helper pod (applied by scripts/drivers/lib-openshift.sh —
# placeholder tokens are substituted; keep this comment free of them).
# Runs spire-agent api fetch jwt in the openshell namespace AS the
# gateway's own ServiceAccount: the SA-based ClusterSPIFFEID mints the
# gateway identity (spiffe://.../ns/openshell/sa/openshell) for this
# pod's UID. This requires the RBAC to create pods in openshell and to
# use its service account — exactly the trust an ephemeral debug
# container on the gateway pod would need, and nothing a sandbox (in
# zt2-sandboxes) holds. The init sleep lets the spire-controller-manager
# mint the pod's entry before the fetch runs (same race as the sandbox
# helper).
apiVersion: v1
kind: Pod
metadata:
  name: zt2-gw-svid
  namespace: openshell
  labels:
    app.kubernetes.io/name: openshell
spec:
  serviceAccountName: openshell
  restartPolicy: Never
  initContainers:
    - name: wait-for-entry
      image: docker.io/busybox:1.36
      command: ["sleep", "15"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
  containers:
    - name: spire-agent
      image: ghcr.io/spiffe/spire-agent:1.12.4
      command: ["/opt/spire/bin/spire-agent", "api", "fetch", "jwt"]
      args:
        - "-socketPath"
        - "/spiffe-workload-api/spire-agent.sock"
        - "-audience"
        - "http://token-issuer.zt-demo.svc:8080"
      volumeMounts:
        - name: spiffe-workload-api
          mountPath: /spiffe-workload-api
          readOnly: true
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
  volumes:
    - name: spiffe-workload-api
      csi:
        driver: csi.spiffe.io
        readOnly: true
