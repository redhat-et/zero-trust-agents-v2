# Template for the zt2-secrets Secret. setup.sh creates the real one
# with generated values -- this file documents the shape and is never
# applied directly.
apiVersion: v1
kind: Secret
metadata:
  name: zt2-secrets
  namespace: zt-demo
type: Opaque
stringData:
  # Shared HS256 secret for demo tokens (issuer + document services).
  # Subject tokens are NOT stored here: setup.sh mints them through the
  # port-forwarded /demo-subject-token listener and stores them in the
  # OpenShell gateway's provider records.
  access-token-secret: "<openssl rand -hex 32>"
