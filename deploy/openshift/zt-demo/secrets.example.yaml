# Template for the zt2-secrets Secret. setup.sh creates the real one
# with generated values -- this file documents the shape and is never
# applied directly.
apiVersion: v1
kind: Secret
metadata:
  name: zt2-secrets
  namespace: zt-demo
type: Opaque
stringData:
  # ES256 signing key for access tokens, PEM (PKCS#8). Only the issuer
  # mounts it; document services verify through the published JWKS.
  # Subject tokens are NOT stored here: setup.sh mints them through the
  # port-forwarded /demo-subject-token listener and stores them in the
  # OpenShell gateway's provider records.
  access-token-signing-key: |
    -----BEGIN PRIVATE KEY-----
    <openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256>
    -----END PRIVATE KEY-----
