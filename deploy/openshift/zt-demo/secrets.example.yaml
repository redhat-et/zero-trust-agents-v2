# Template for the zt2-secrets Secret. setup.sh creates the real one
# with generated values -- this file documents the shape and is never
# applied directly.
apiVersion: v1
kind: Secret
metadata:
  name: zt2-secrets
  namespace: zt-demo
type: Opaque
stringData:
  # Shared HS256 secret for demo tokens (issuer + document services).
  access-token-secret: "<openssl rand -hex 32>"
  # Per-user demo subject tokens, minted by setup.sh through the
  # port-forwarded /demo-subject-token listener and stored for
  # gateway-side exchange (one key per demo user).
  subject-token-alice: "<minted by setup.sh>"
  subject-token-carol: "<minted by setup.sh>"
