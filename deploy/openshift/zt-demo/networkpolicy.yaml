# zt-demo ingress: default-deny, allow only the sandbox namespace
# (supervisor pods broker every sandbox request). Production
# recommendations narrow this from namespace-wide to supervisor pods
# (see docs/PRODUCTION_RECOMMENDATIONS.md).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: zt-demo
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-sandbox-supervisors
  namespace: zt-demo
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: zt2-sandboxes
