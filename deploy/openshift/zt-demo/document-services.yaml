# Per-department document services: one Deployment + Service each,
# matching DOC_DEPTS in deploy/podman/scripts/start-services.sh. All
# five are required: scenario 6 replays an engineering token against
# finance (DOC-005) and scenario 3 health-checks engineering directly.
#
# The document service validates audience + scope on the final token
# (iss check against ACCESS_TOKEN_ISSUER) and serves the department's
# sample documents.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-engineering
  namespace: zt-demo
  labels:
    app: document-engineering
spec:
  replicas: 1
  selector:
    matchLabels:
      app: document-engineering
  template:
    metadata:
      labels:
        app: document-engineering
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: document-service
          image: quay.io/panni/zt2-document-service:v2
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ACCESS_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: zt2-secrets
                  key: access-token-secret
            - name: ACCESS_TOKEN_ISSUER
              value: http://token-issuer.zt-demo.svc:8080
            - name: DEPARTMENT
              value: "engineering"
            - name: PORT
              value: :8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: document-engineering
  namespace: zt-demo
spec:
  selector:
    app: document-engineering
  ports:
    - name: http
      port: 8080
      targetPort: http
