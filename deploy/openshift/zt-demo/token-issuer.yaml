# Token issuer: mints demo user subject tokens and performs the RFC
# 8693 gateway (intermediate) and supervisor (final) exchanges,
# verifying SPIFFE JWT-SVIDs against SPIRE's JWKS.
#
# Hard constraint: the Service must be `token-issuer` in `zt-demo` on
# port 8080 — the provider profiles hardcode
# http://token-issuer.zt-demo.svc:8080 as both token_endpoint and
# jwt_svid_audience.
#
# The unauthenticated /demo-subject-token listener (:8090) is a
# container port with NO Service and NO Route: setup.sh reaches it
# with `oc port-forward deploy/token-issuer` only, matching Stage 1's
# loopback-only publish.
#
# config/users.yaml is baked into the image at /config/users.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: token-issuer
  namespace: zt-demo
  labels:
    app: token-issuer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: token-issuer
  template:
    metadata:
      labels:
        app: token-issuer
    spec:
      containers:
        - name: token-issuer
          image: quay.io/panni/zt2-token-issuer:v2
          ports:
            - name: http
              containerPort: 8080
            - name: demo
              containerPort: 8090
          env:
            - name: ACCESS_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: zt2-secrets
                  key: access-token-secret
            - name: ACCESS_TOKEN_ISSUER
              value: http://token-issuer.zt-demo.svc:8080
            - name: JWT_SVID_AUDIENCE
              value: http://token-issuer.zt-demo.svc:8080
            - name: SPIRE_ISSUER
              value: https://spire-spiffe-oidc-discovery-provider.spire.svc.cluster.local
            - name: SPIRE_JWKS_URI
              value: https://spire-spiffe-oidc-discovery-provider.spire.svc.cluster.local/keys
            - name: SPIRE_JWKS_CA_FILE
              value: /etc/spiffe-bundle/bundle.pem
            - name: GATEWAY_TRUST_DOMAIN_PREFIX
              value: spiffe://openshell.local/ns/openshell/sa/
            - name: SUPERVISOR_TRUST_DOMAIN_PREFIX
              value: spiffe://openshell.local/openshell/sandbox/
            - name: PORT
              value: :8080
            - name: USERS_FILE
              value: /config/users.yaml
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: spiffe-bundle
              mountPath: /etc/spiffe-bundle
              readOnly: true
        # spiffe-helper sidecar (upstream
        # examples/spiffe-token-exchange-demo pattern): fetches the
        # SPIFFE trust bundle from the SPIRE agent via the CSI-mounted
        # Workload API socket and writes bundle.pem to the shared
        # volume. The issuer verifies the OIDC discovery provider's TLS
        # certificate (signed by that bundle) via SPIRE_JWKS_CA_FILE.
        - name: spiffe-helper
          image: ghcr.io/spiffe/spiffe-helper:0.11.0
          imagePullPolicy: IfNotPresent
          args: ["-config", "/etc/spiffe-helper/spiffe-helper.conf"]
          volumeMounts:
            - name: spiffe-socket
              mountPath: /run/spire/sockets
              readOnly: true
            - name: spiffe-bundle
              mountPath: /target
            - name: helper-config
              mountPath: /etc/spiffe-helper
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: spiffe-socket
          csi:
            driver: csi.spiffe.io
            readOnly: true
        - name: spiffe-bundle
          emptyDir: {}
        - name: helper-config
          configMap:
            name: spiffe-helper-conf
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spiffe-helper-conf
  namespace: zt-demo
data:
  spiffe-helper.conf: |
    agent_address = "/run/spire/sockets/spire-agent.sock"
    cert_dir = "/target"
    svid_file_name = "svid.pem"
    svid_key_file_name = "key.pem"
    svid_bundle_file_name = "bundle.pem"
---
apiVersion: v1
kind: Service
metadata:
  name: token-issuer
  namespace: zt-demo
spec:
  selector:
    app: token-issuer
  ports:
    - name: http
      port: 8080
      targetPort: http
