# SVID helper pod for the OpenShift scenario harness. Never applied
# as-is: scripts/drivers/lib-openshift.sh substitutes the pod name, the
# target SPIFFE ID, and the annotation block (hence the placeholder
# tokens below -- keep this comment free of them).
# Runs spire-agent api fetch jwt against the CSI-mounted Workload API
# socket in the sandbox namespace, so SPIRE attributes the fetch to
# whatever identity the annotations select, and prints the JWT-SVID to
# stdout (the driver reads it from `oc logs`). The spire-agent image is
# distroless: no shell, no sleep -- the fetch IS the container command,
# and the pod terminating is the signal that the fetch finished.
# For supervisor fetches the annotation is the sandbox's
# openshell.ai/sandbox-id; for the rogue fetch it is an annotation no
# ClusterSPIFFEID matches, and SPIRE refuses to mint (pod fails).
apiVersion: v1
kind: Pod
metadata:
  name: @POD_NAME@
  namespace: zt2-sandboxes
  # The ClusterSPIFFEID's podSelector requires the managed-by label the
  # real supervisor pods carry; the sandbox-id ANNOTATION feeds the
  # spiffeIDTemplate.
  labels:
    openshell.ai/managed-by: openshell
  annotations:
@ANNOTATIONS@spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
  # The spire-controller-manager mints per-pod-UID entries when it
  # reconciles (every few seconds): the fetch must not run before the
  # helper's own entry exists. The spire-agent image is distroless (no
  # sleep), so a busybox init container holds the pod open for the
  # controller to catch up.
  initContainers:
    - name: wait-for-entry
      image: docker.io/busybox:1.36
      command: ["sleep", "15"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
  containers:
    - name: spire-agent
      image: ghcr.io/spiffe/spire-agent:1.12.4
      command: ["/opt/spire/bin/spire-agent", "api", "fetch", "jwt"]
      args:
        - "-socketPath"
        - "/spiffe-workload-api/spire-agent.sock"
        - "-audience"
        - "http://token-issuer.zt-demo.svc:8080"
        - "-spiffeID"
        - "@SPIFFE_ID@"
      volumeMounts:
        - name: spiffe-workload-api
          mountPath: /spiffe-workload-api
          readOnly: true
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
  volumes:
    - name: spiffe-workload-api
      csi:
        driver: csi.spiffe.io
        readOnly: true
